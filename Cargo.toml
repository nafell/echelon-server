[package]
name = "echelon-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full", "sync"] } # "full" feature を有効化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
influxdb = { version = "0.7.2", features = ["derive"] }
chrono = { version = "0.4" }
rmp-serde = { version = "1.3" }
async_ftp = "5.0"