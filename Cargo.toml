[package]
name = "echelon-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full", "sync"] } # "full" feature を有効化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
suppaftp = { version = "4.0", features = ["tokio_rustls"] }
chrono = "0.4"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"